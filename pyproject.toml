[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Sample review/complaint text and rendered markdown are content, not code --
# wrapping the string literals would change the data these files emit.
"data/generate_feedback_dataset.py" = ["E501"]
"scripts/gen_function_examples_call_transcript_collector.py" = ["E501"]
