<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8894a8"/>
    </marker>
    <style>
      .t   { fill:#0b1220; font-size:38px; font-weight:700 }
      .sub { fill:#5a6779; font-size:19px }
      .band{ rx:10 }
      .bl  { fill:#8894a8; font-size:13px; font-weight:700; letter-spacing:1.6px }
      .card{ rx:9; stroke-width:1.6 }
      .svc { font-size:17px; font-weight:700 }
      .dsc { font-size:13.5px }
      .note{ fill:#6b7688; font-size:13px }
      .conn{ stroke:#8894a8; stroke-width:1.8; fill:none; marker-end:url(#a) }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>

  <text class="t" x="60" y="72">Multimodal Customer Feedback Pipeline</text>
  <text class="sub" x="60" y="104">Four incompatible sources → one document shape → one foundation-model call. Built on AWS.</text>
  <line x1="60" y1="126" x2="1140" y2="126" stroke="#e6eaf1" stroke-width="2"/>

  <!-- ROW 1 : sources in S3 -->
  <text class="bl" x="60" y="163">SOURCES · S3 raw-data/</text>
  <rect class="band" x="60" y="176" width="1080" height="86" fill="#f4f6fa" stroke="#dde3ec"/>
  <g>
    <rect class="card" x="76" y="192" width="252" height="54" fill="#eef7e3" stroke="#7aa116"/>
    <text class="svc" x="92" y="215" fill="#41600d">20 product reviews</text>
    <text class="dsc" x="92" y="234" fill="#5a6b3a">JSON · free text + rating</text>

    <rect class="card" x="344" y="192" width="252" height="54" fill="#eef7e3" stroke="#7aa116"/>
    <text class="svc" x="360" y="215" fill="#41600d">5 scanned documents</text>
    <text class="dsc" x="360" y="234" fill="#5a6b3a">PNG · returns &amp; warranty forms</text>

    <rect class="card" x="612" y="192" width="252" height="54" fill="#eef7e3" stroke="#7aa116"/>
    <text class="svc" x="628" y="215" fill="#41600d">3 support calls</text>
    <text class="dsc" x="628" y="234" fill="#5a6b3a">MP3 · two speakers</text>

    <rect class="card" x="880" y="192" width="244" height="54" fill="#eef7e3" stroke="#7aa116"/>
    <text class="svc" x="896" y="215" fill="#41600d">30 survey responses</text>
    <text class="dsc" x="896" y="234" fill="#5a6b3a">CSV · ratings + comments</text>
  </g>

  <path class="conn" d="M202,262 L202,300"/>
  <path class="conn" d="M470,262 L470,300"/>
  <path class="conn" d="M738,262 L738,300"/>
  <path class="conn" d="M1002,262 L1002,300"/>

  <!-- ROW 2 : four different integration patterns -->
  <text class="bl" x="60" y="330">VALIDATE &amp; EXTRACT · four deliberately different patterns</text>
  <rect class="band" x="60" y="344" width="1080" height="196" fill="#f4f6fa" stroke="#dde3ec"/>

  <!-- reviews -->
  <rect class="card" x="76" y="362" width="252" height="44" fill="#fdefe3" stroke="#ed7100"/>
  <text class="svc" x="92" y="381" fill="#8a4200">Lambda · validator</text>
  <text class="dsc" x="92" y="398" fill="#8a5a2a">8 checks · FATAL vs ADVISORY</text>
  <path class="conn" d="M202,406 L202,432"/>
  <rect class="card" x="76" y="434" width="252" height="44" fill="#e3f6f2" stroke="#01a88d"/>
  <text class="svc" x="92" y="453" fill="#04695a">Comprehend</text>
  <text class="dsc" x="92" y="470" fill="#2a6b5f">DetectSentiment</text>
  <text class="note" x="92" y="510">per record · synchronous</text>

  <!-- images -->
  <rect class="card" x="344" y="362" width="252" height="44" fill="#fdefe3" stroke="#ed7100"/>
  <text class="svc" x="360" y="381" fill="#8a4200">Lambda · extractor</text>
  <text class="dsc" x="360" y="398" fill="#8a5a2a">S3 event trigger</text>
  <path class="conn" d="M470,406 L470,432"/>
  <rect class="card" x="344" y="434" width="252" height="44" fill="#e3f6f2" stroke="#01a88d"/>
  <text class="svc" x="360" y="453" fill="#04695a">Textract</text>
  <text class="dsc" x="360" y="470" fill="#2a6b5f">AnalyzeDocument · block graph</text>
  <text class="note" x="360" y="510">document extraction</text>

  <!-- calls -->
  <rect class="card" x="612" y="362" width="252" height="44" fill="#e3f6f2" stroke="#01a88d"/>
  <text class="svc" x="628" y="381" fill="#04695a">Transcribe</text>
  <text class="dsc" x="628" y="398" fill="#2a6b5f">async job · speaker labels</text>
  <path class="conn" d="M738,406 L738,432"/>
  <rect class="card" x="612" y="434" width="252" height="44" fill="#f1e8ff" stroke="#8c4fff"/>
  <text class="svc" x="628" y="453" fill="#4b1a9e">EventBridge → Lambda</text>
  <text class="dsc" x="628" y="470" fill="#5b3a94">thin event → GetTranscriptionJob</text>
  <text class="note" x="628" y="510">async job + callback · 2 Lambdas</text>

  <!-- surveys -->
  <rect class="card" x="880" y="362" width="244" height="44" fill="#f1e8ff" stroke="#8c4fff"/>
  <text class="svc" x="896" y="381" fill="#4b1a9e">Glue Crawler + DQ</text>
  <text class="dsc" x="896" y="398" fill="#5b3a94">catalog · DQDL ruleset</text>
  <path class="conn" d="M1002,406 L1002,432"/>
  <rect class="card" x="880" y="434" width="244" height="44" fill="#e3f6f2" stroke="#01a88d"/>
  <text class="svc" x="896" y="453" fill="#04695a">SageMaker Processing</text>
  <text class="dsc" x="896" y="470" fill="#2a6b5f">batch container · ml.m5.large</text>
  <text class="note" x="896" y="510">whole file · batch</text>

  <path class="conn" d="M202,540 L202,574"/>
  <path class="conn" d="M470,540 L470,574"/>
  <path class="conn" d="M738,540 L738,574"/>
  <path class="conn" d="M1002,540 L1002,574"/>

  <!-- ROW 3 : processed -->
  <rect class="band" x="60" y="576" width="1080" height="58" fill="#eef7e3" stroke="#7aa116"/>
  <text class="svc" x="84" y="602" fill="#41600d">S3 processed-data/</text>
  <text class="dsc" x="84" y="622" fill="#5a6b3a">reviews · images · calls · surveys — still four different shapes</text>
  <text class="note" x="1116" y="612" text-anchor="end">53 records</text>

  <path class="conn" d="M600,634 L600,676"/>

  <!-- ROW 4 : normalise -->
  <rect class="band" x="60" y="678" width="1080" height="112" fill="#eef1ff" stroke="#c7cffb"/>
  <text class="bl" x="84" y="704" fill="#4657c9">NORMALISE</text>
  <text class="svc" x="84" y="730" fill="#2b3a9e">One document shape</text>
  <text class="dsc" x="84" y="750" fill="#4a56a8">text · signals · provenance — each field says how it was produced</text>
  <text class="dsc" x="84" y="772" fill="#4a56a8">order references extracted for the one deterministic cross-channel join</text>

  <rect class="card" x="772" y="698" width="352" height="74" fill="#e3f6f2" stroke="#01a88d"/>
  <text class="svc" x="790" y="722" fill="#04695a">Comprehend · DetectPiiEntities</text>
  <text class="dsc" x="790" y="741" fill="#2a6b5f">names redacted before anything leaves</text>
  <text class="dsc" x="790" y="760" fill="#2a6b5f">SKUs kept: the detector has false positives</text>

  <path class="conn" d="M420,790 L420,832"/>
  <path class="conn" d="M860,790 L860,832"/>

  <!-- ROW 5 : two tiers -->
  <text class="bl" x="60" y="862">TWO TIERS · whichever can actually judge the record</text>
  <rect class="band" x="60" y="876" width="524" height="150" fill="#fff3f8" stroke="#f6c2d9"/>
  <text class="svc" x="84" y="906" fill="#a3105a">Deterministic quality gate</text>
  <text class="dsc" x="84" y="928" fill="#8d3a68">rule: sentiment vs stated rating · runs on 100% of records</text>
  <text class="dsc" x="84" y="950" fill="#8d3a68">→ S3 quality-review/ + CloudWatch MismatchRate</text>
  <text class="dsc" x="84" y="978" fill="#8d3a68">precision 1.00 · recall 1.00 on planted mismatches</text>
  <text class="note" x="84" y="1004">cheap, reproducible, blind to anything a rule cannot state</text>

  <rect class="band" x="616" y="876" width="524" height="150" fill="#e3f6f2" stroke="#01a88d"/>
  <text class="svc" x="640" y="906" fill="#04695a">Bedrock · Claude Haiku 4.5</text>
  <text class="dsc" x="640" y="928" fill="#2a6b5f">ONE call over all 47 documents · ~2 cents</text>
  <text class="dsc" x="640" y="950" fill="#2a6b5f">→ S3 insights/: themes, call outcomes, actions</text>
  <text class="dsc" x="640" y="978" fill="#2a6b5f">every claim cites a document id, and citations are verified</text>
  <text class="note" x="640" y="1004">finds what only appears across channels</text>

  <path class="conn" d="M322,1026 L322,1062"/>
  <path class="conn" d="M878,1026 L878,1062"/>

  <!-- ROW 6 : outcome -->
  <rect class="band" x="60" y="1064" width="1080" height="66" fill="#0b1220" stroke="#0b1220"/>
  <text x="84" y="1092" fill="#ffffff" font-size="18px" font-weight="700">Actionable output, scored against a ground truth written before the model ran</text>
  <text x="84" y="1114" fill="#9fb0c9" font-size="14px">3 of 3 planted product defects found across channels · 0 invented for control products · hallucinated citations detected automatically</text>

  <text class="note" x="60" y="1158">S3 · Lambda · EventBridge · Comprehend · Textract · Transcribe · Glue (Crawler, Catalog, Data Quality) · SageMaker Processing · Bedrock · CloudWatch · IAM</text>
  
</svg>
